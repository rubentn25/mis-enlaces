<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123c35">
<title>Encuéntranos online</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#e8f4ee,#f8fbf9);color:#173b34;padding:24px}
main{width:100%;max-width:440px;background:#fff;border-radius:26px;padding:30px 24px;box-shadow:0 16px 50px #163d321c;text-align:center}
.mark{width:68px;height:68px;border-radius:20px;background:#123c35;color:white;display:grid;place-items:center;font-size:30px;margin:0 auto 18px}
h1{font-size:27px;margin:0 0 10px}p{color:#60716c;line-height:1.5;margin:0 0 24px}
a{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:#183c35;font-weight:700;
padding:16px;border:1px solid #e2ebe6;border-radius:16px;margin:12px 0;transition:transform .15s,background .15s}
a:hover{background:#f4faf6;transform:translateY(-1px)}.icon{width:42px;height:42px;display:grid;place-items:center;color:#fff;border-radius:12px;font-size:22px}
.fb{background:#1877f2}.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.web{background:#16856b}
small{display:block;color:#82918b;margin-top:22px;font-size:12px}
</style></head>
<body><main>
<div class="mark">↗</div>
<h1>¡Conecta con nosotros!</h1>
<p>Elige dónde quieres encontrarnos.</p>
<a href="https://share.google/2CvVEvdG22Cphprbd" target="_blank" rel="noopener noreferrer"><span class="icon fb">f</span><span>Facebook</span></a>
<a href="https://share.google/ssjtbBAJZXE9ubfFl" target="_blank" rel="noopener noreferrer"><span class="icon ig">◎</span><span>Instagram</span></a>
<a href="https://share.google/3wrfHsR3fOvNsxSDM" target="_blank" rel="noopener noreferrer"><span class="icon web">↗</span><span>Página web</span></a>
<small>Gracias por visitarnos</small>
</main></body></html>
